packages:
  - '.'
  - 'packages/*'
  - 'src-api'
  - 'src-video'

# Build hooks allowed to run during install. Migrated from package.json
# `pnpm.onlyBuiltDependencies` (ignored by pnpm 10.33+).
ignoredBuiltDependencies:
  - '@google/genai'
allowBuilds:
  '@contentauth/c2pa-node': true
  '@google/genai': true
  '@scarf/scarf': true
  better-sqlite3: true
  esbuild: true
  fs-xattr: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# Transitive version pins. Migrated from package.json `pnpm.overrides`
# (ignored by pnpm 10.33+). Every entry needs an inline reason.
overrides:
  # One Hono copy. MCP SDK and Hyperframes resolve 4.13.3 while the API
  # depends on 4.13.9, and the two Hono classes are not assignable
  # (CopilotKit route mount in http-daemon.ts).
  hono: '4.13.9'
  # Transitive consistency — keep markdown ecosystem on a single major.
  unified: '^11.0.5'
  # Hold AG-UI runtime to the version our app integrates against.
  # Raised to 0.0.59 2026-09-27 (G7) to match @copilotkit/* 1.74's exact pin.
  # @ag-ui 1.0 is held: CopilotKit still depends on 0.0.59.
  '@ag-ui/client': '^0.0.59'
  '@ag-ui/core': '^0.0.59'
  '@ag-ui/encoder': '^0.0.59'
  # Force-bump Slack Web API to keep transitive Bolt deps on the same minor.
  # Raised to 8.1.x 2026-09-27 (G10) alongside @slack/bolt 5.1 / web-api 8.1.1.
  '@slack/web-api': '^8.1.1'
  # CVE / supply-chain pins for lodash family.
  lodash: '^4.18.1'
  lodash-es: '^4.18.1'
  # CVE-CVE-2024-45296 and the v8 range fix for path-to-regexp.
  'path-to-regexp@<0.1.13': '0.1.13'
  'path-to-regexp@>=8.0.0 <8.4.0': '^8.4.2'
  # CVE-2023-36665 (protobufjs prototype pollution). Raised floor to
  # 7.6.5 2026-08-08 — GHSA .proto option-parsing DoS fixed at 7.6.5;
  # `pnpm install` doesn't proactively re-resolve within an already-
  # satisfied range, so the floor itself has to move.
  protobufjs: '^7.6.5'
  # CVE-2024-39338 (axios SSRF) — keep transitives on a patched minor.
  # Raised floor to 1.20.0 2026-09-30 — high advisories through 1.19.0
  # (ReDoS, prototype pollution, HTTP/2 DNS/proxy bypass, redirect SSRF)
  # are fixed at 1.20.0. `pnpm install` does not re-resolve inside an
  # already-satisfied range, so the floor itself has to move.
  axios: '1.20.0'
  # workbox lineage required by vite-plugin-pwa; pin until plugin catches up.
  # Re-checked 2026-08-21 (G3) — no newer vite-plugin-pwa release yet.
  workbox-build: '^7.4.1'
  workbox-window: '^7.4.1'
  # CVE — esbuild <0.28.1 missing binary integrity verification (GHSA, Deno).
  # Patch-bump only the prod 0.28.0 peer (@remotion/bundler); the dev-only
  # 0.25/0.27 copies (vite/vitest) are out of the --prod audit and untouched.
  # Retargeted to 0.28.2 2026-08-21 (G1) to track the current patch release.
  'esbuild@0.28.0': '0.28.2'
  # 2026-08-21 (G3) — 4 brace-expansion DoS advisories (quadratic/unbounded
  # expansion) reach two vulnerable resolutions via workbox-build's jake/glob
  # transitives (vite-plugin-pwa, dev-only). Scoped by range so minimatch@10.x's
  # own brace-expansion@^4.x requirement isn't force-downgraded across a major.
  'brace-expansion@>=2.0.0 <2.1.4': '2.1.4'
  'brace-expansion@>=4.0.0 <5.0.9': '5.0.9'
  # GHSA-96hv-2xvq-fx4p — force Remotion transitives onto patched ws.
  # Raised to 8.22.0 2026-09-27 (G8) to track the current patch.
  ws: '8.22.0'
  # GHSA-vxpw-j846-p89q — discord.js pins undici 6.24.1; force patched 6.x.
  # Raised 2026-08-08: 6.27.0 itself gained 3 moderate advisories (response
  # desync, CRLF injection, cookie injection) fixed at 6.28.0.
  # Widened 2026-08-20 (GHSA-vrm6-8vpv-qv8q, GHSA-v9p9-hfj2-hcw8) — the
  # @ai-sdk/google-vertex branch of @copilotkit/runtime pulls an older
  # @ai-sdk/provider-utils@3.x that depends on undici@^5.29.0 directly, which
  # is outside the >=6.0.0 floor above but still matches these advisories'
  # vulnerable range. Vertex is transitive-only (unused by this app), so the
  # major bump to 6.28.0 has no reachable code path to regress.
  # Raised 2026-09-29: 6.28.0 matches GHSA-rfgv-xxqx-mfg5 (unrequested
  # WebSocket subprotocol DoS, fixed at 6.28.1); 7.x <7.29.1 matches that and
  # GHSA-w293-vg96-wgc3 (BalancedPool TLS validation bypass). `pnpm install`
  # does not re-resolve inside an already-satisfied range, so the pins move.
  'undici@<6.28.1': '6.28.1'
  'undici@>=7.0.0 <7.29.1': '7.29.1'
  # GHSA-xcpc-8h2w-3j85 and GHSA-7q85-xj36-vmfc — adm-zip allocates from the
  # declared uncompressed size before validating it. Bundled by onnxruntime-node
  # (unpacks native binaries at install time) and hyperframes. Raised the floor
  # to 0.6.1 on 2026-09-22: 0.6.0 still matches GHSA-7q85-xj36-vmfc, and pnpm
  # does not re-resolve inside an already-satisfied range.
  adm-zip: '^0.6.1'
  # GHSA-rgj7-g3m4-5g8c — sharp <0.35.4 includes vulnerable libheif builds.
  # Keep direct and transitive copies on the patched release.
  sharp: '^0.35.4'
  # GHSA-w5hq-g745-h8pq — CopilotKit runtime still allows vulnerable uuid 10.
  'uuid@10.0.0': '11.1.1'
  # 2026-08-08: node-tar critical DoS (GHSA-23hp-3jrh-7fpw) + 3 more advisories
  # in @yao-pkg/pkg's bundled tar; pin to the patched line until pkg vendors it.
  '@yao-pkg/pkg>tar': '^7.5.21'
  # 2026-09-03: GHSA-5jgf-p345-68v8 and related host-confusion / SSRF fixes.
  # Keep the transitive v3 line used by ajv on the first patched release.
  # transitive via ajv/ajv-formats under @modelcontextprotocol/sdk.
  fast-uri: '^3.1.6'
  # 2026-09-03: GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g. Remotion's
  # webpack chain accepts current browserslist 4.x, so force the patched line.
  browserslist: '^4.28.7'
  # GHSA-mwp4-54f8-5fhr (ip-address leading-zero octet SSRF bypass) —
  # transitive via express-rate-limit under @modelcontextprotocol/sdk.
  ip-address: '^10.3.1'
  # GHSA-2883-xcg3-v3hh — transitive via cosmiconfig under @remotion/cli's
  # @svgr/core and @remotion/tailwind.
  js-yaml: '^4.3.2'
  # GHSA-jqcg-44mw-7w3h — Express's proxy-addr permits IP spoofing through
  # IPv4-mapped IPv6 trust subnets; keep its 2.x copies on the patched release.
  'proxy-addr@>=1.1.0 <2.0.8': '2.0.8'
  # GHSA-68fv-2mgg-jv7q — indexed source-map offsets can block the event loop.
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  # GHSA-7mx3-vvmw-hjmv — mergeDeep prototype pollution. Older 10.x/11.x
  # GraphQL Yoga transitives have no patched release on their original majors.
  '@graphql-tools/utils@<=12.0.0': '12.0.1'
peerDependencyRules:
  allowedVersions:
    # tailwindcss-animate has not widened its peer range text for Tailwind 4,
    # but this app has already migrated to Tailwind 4.
    tailwindcss: '>=4.0.0'
    # CopilotKit keeps a narrow optional Anthropic SDK 0.57 peer while this app
    # imports the current Anthropic SDK directly.
    '@anthropic-ai/sdk': '>=0.57.0 <1.0.0'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3: deeply nested patterns can exhaust the call stack. No
    # patched release exists (advisory first_patched_version is null; 3.0.3 is
    # latest). The only production-audit paths are Remotion/Tailwind build
    # tooling in src-video, which receives repository-owned glob patterns, not
    # runtime or user-supplied patterns. Remove when braces publishes a fix.
    # Reviewed 2026-10-02.
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <=1.4.0: RSA PKCS#1 v1.5 signature verification accepts
    # extra DigestAlgorithm elements. No patched release exists (advisory
    # first_patched_version is null; 1.4.0 is latest). The only path is
    # src-api > @anthropic-ai/sandbox-runtime, which uses node-forge to
    # generate keys and sign its MITM proxy CA and leaf certificates; it never
    # verifies signatures. Remove when node-forge or sandbox-runtime ships a
    # fix. Reviewed 2026-10-02.
    - GHSA-86w9-cpqp-85rv

minimumReleaseAgeExclude:
  - read-excel-file@9.3.10
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.239'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.239'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.239'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.239'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.239'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.239'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.239'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.239'
  - '@anthropic-ai/claude-agent-sdk@0.3.239'
  - '@tauri-apps/api@2.12.0'
  - '@tauri-apps/cli-darwin-arm64@2.12.0'
  - '@tauri-apps/cli-darwin-x64@2.12.0'
  - '@tauri-apps/cli-linux-arm-gnueabihf@2.12.0'
  - '@tauri-apps/cli-linux-arm64-gnu@2.12.0'
  - '@tauri-apps/cli-linux-arm64-musl@2.12.0'
  - '@tauri-apps/cli-linux-riscv64-gnu@2.12.0'
  - '@tauri-apps/cli-linux-x64-gnu@2.12.0'
  - '@tauri-apps/cli-linux-x64-musl@2.12.0'
  - '@tauri-apps/cli-win32-arm64-msvc@2.12.0'
  - '@tauri-apps/cli-win32-ia32-msvc@2.12.0'
  - '@tauri-apps/cli-win32-x64-msvc@2.12.0'
  - '@tauri-apps/cli@2.12.0'
  - '@tauri-apps/plugin-autostart@2.6.0'
  - '@tauri-apps/plugin-dialog@2.8.0'
  - '@tauri-apps/plugin-fs@2.6.0'
  - '@tauri-apps/plugin-notification@2.5.0'
  - '@tauri-apps/plugin-opener@2.6.0'
  - '@tauri-apps/plugin-process@2.4.0'
  - '@tauri-apps/plugin-shell@2.4.0'
  - '@tauri-apps/plugin-sql@2.5.0'
  - '@tauri-apps/plugin-stronghold@2.4.0'
