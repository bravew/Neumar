# Relic signing configuration for Azure Key Vault
# See: https://github.com/sassoftware/relic
#
# Replace VAULT_NAME and CERT_NAME with your Azure Key Vault values.
# Authentication uses environment variables (no secrets in this file):
#   AZURE_CLIENT_ID     - App Registration client ID
#   AZURE_TENANT_ID     - Azure directory tenant ID
#   AZURE_CLIENT_SECRET - App Registration client secret

tokens:
  azure:
    type: azure

keys:
  azure:
    token: azure
    id: https://VAULT_NAME.vault.azure.net/certificates/CERT_NAME
