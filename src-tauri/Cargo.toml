[package]
name = "neumar"
version = "26.8.20"
description = "A desktop AI agent application that works tirelessly like a bull and horse to execute tasks through natural language."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neumar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# `macos-private-api` is required so the transparent, frameless desktop pet
# overlay window can use the macOS-only NSWindow background-color API. Pair
# with `app.macOSPrivateApi: true` in tauri.conf.json.
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-keychain = "2.0.2"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = { version = "2.10.1", features = ["native-tls"], default-features = false }
tauri-plugin-process = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.20.0", features = ["v4"] }

# Workspace watcher — drives debounced graphify rebuild + RAG reindex on file change.
notify = "8"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = ["CLLocation", "CLLocationManager"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKPDFConfiguration", "block2"] }
libc = "0.2"

# Speed up Argon2 hashing in dev builds (stronghold uses it for vault unlock)
[profile.dev.package.scrypt]
opt-level = 3

# Tauri-recommended size-optimized release profile.
# `opt-level = "s"` chosen over "z" empirically — "s" produced the smaller
# binary for our crate graph. Re-test if dependency churn is significant.
# `lto = true` is memory-hungry; if CI runners OOM, fall back to "thin".
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
