<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass Dashboard</title>
    <style>
      :root {
        --bg-from: #6d8bd8;
        --bg-to: #b8a7e6;
        --glass: rgba(255, 255, 255, 0.55);
        --glass-strong: rgba(255, 255, 255, 0.72);
        --glass-border: rgba(255, 255, 255, 0.6);
        --fg: #16203a;
        --muted: #4a566f;
        --accent: #2b59ff;
        --good: #0f9d6b;
        --radius: 22px;
        --blur: blur(14px);
        --ring: 0 0 0 3px rgba(43, 89, 255, 0.45);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--fg);
        padding: 28px clamp(16px, 4vw, 40px) 120px;
        background:
          radial-gradient(
            120% 120% at 0% 0%,
            var(--bg-from) 0%,
            transparent 60%
          ),
          radial-gradient(
            120% 120% at 100% 100%,
            var(--bg-to) 0%,
            transparent 55%
          ),
          linear-gradient(135deg, #51607f, #2c3550);
        background-attachment: fixed;
      }
      .glass {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: 0 8px 30px rgba(16, 24, 48, 0.18);
      }
      /* Accessibility fallback: solid surface where backdrop-filter is absent. */
      @supports (backdrop-filter: blur(2px)) {
        .glass {
          backdrop-filter: var(--blur);
          -webkit-backdrop-filter: var(--blur);
        }
      }
      @supports not (backdrop-filter: blur(2px)) {
        .glass {
          background: var(--glass-strong);
        }
      }
      header.topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        margin-bottom: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
      }
      .brand .dot {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: #fff;
      }
      .switcher {
        display: flex;
        gap: 4px;
        padding: 4px;
        margin-left: auto;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.35);
      }
      .switcher button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        padding: 7px 16px;
        border-radius: 999px;
        cursor: pointer;
      }
      .switcher button[aria-pressed='true'] {
        background: #fff;
        color: var(--fg);
        box-shadow: 0 3px 10px rgba(16, 24, 48, 0.12);
      }
      .icon-btn {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.35);
        color: var(--fg);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      button:focus-visible,
      .icon-btn:focus-visible,
      .switcher button:focus-visible {
        outline: none;
        box-shadow: var(--ring);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .card {
        padding: 20px;
      }
      .kpi .label {
        color: var(--muted);
        font-size: 13px;
      }
      .kpi .value {
        font-size: 30px;
        font-weight: 680;
        margin: 6px 0 2px;
      }
      .trend {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        color: var(--good);
      }
      .panel-title {
        margin: 0 0 14px;
        font-size: 15px;
      }
      .activity {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 650;
        color: #fff;
        background: linear-gradient(135deg, #2b59ff, #7a5cff);
      }
      .row .meta {
        line-height: 1.3;
      }
      .row .who {
        font-weight: 600;
        font-size: 14px;
      }
      .row .sub {
        color: var(--muted);
        font-size: 12px;
      }
      /* Live "voice-wave" indicator — bars that pulse while a speaker is active. */
      .wave {
        margin-left: auto;
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 20px;
      }
      .wave span {
        width: 3px;
        height: 6px;
        border-radius: 2px;
        background: var(--accent);
        animation: bounce 1s ease-in-out infinite;
      }
      .wave span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .wave span:nth-child(3) {
        animation-delay: 0.3s;
      }
      .wave span:nth-child(4) {
        animation-delay: 0.45s;
      }
      .row.idle .wave span {
        animation: none;
        opacity: 0.35;
      }
      @keyframes bounce {
        0%,
        100% {
          height: 6px;
        }
        50% {
          height: 18px;
        }
      }
      .skeleton {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        height: 14px;
      }
      .skeleton::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.6),
          transparent
        );
        transform: translateX(-100%);
        animation: shimmer 1.4s infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      .controlbar {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        padding: 10px 12px;
      }
      .controlbar .primary {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .controlbar .primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      @media (prefers-reduced-motion: reduce) {
        .wave span,
        .skeleton::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div data-od-id="dashboard-shell">
      <header class="glass topbar" data-od-id="topbar">
        <div class="brand">
          <span class="dot" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="8" height="8" rx="2" fill="#fff" />
              <rect x="13" y="3" width="8" height="5" rx="2" fill="#fff" />
              <rect x="13" y="10" width="8" height="11" rx="2" fill="#fff" />
              <rect x="3" y="13" width="8" height="8" rx="2" fill="#fff" />
            </svg>
          </span>
          Operations
        </div>
        <div class="switcher" role="tablist" aria-label="View">
          <button role="tab" aria-pressed="true">Dashboard</button>
          <button role="tab" aria-pressed="false">Rooms</button>
        </div>
        <button class="icon-btn" aria-label="Search">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3-3" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <div class="layout">
        <section class="grid" data-od-id="kpi-grid" aria-label="Key metrics">
          <article class="glass card kpi" data-od-id="kpi-active">
            <div class="label">Active rooms</div>
            <div class="value">12</div>
            <span class="trend">▲ 8% this week</span>
          </article>
          <article class="glass card kpi" data-od-id="kpi-participants">
            <div class="label">Participants</div>
            <div class="value">248</div>
            <span class="trend">▲ 3%</span>
          </article>
          <article class="glass card kpi" data-od-id="kpi-uptime">
            <div class="label">Uptime</div>
            <div class="value">99.9%</div>
            <span class="trend">stable</span>
          </article>
          <!-- Loading state example: swap to real data on load. -->
          <article
            class="glass card kpi"
            data-od-id="kpi-latency"
            aria-busy="true"
          >
            <div class="label">Avg latency</div>
            <div class="skeleton" style="width: 60%; margin: 10px 0"></div>
            <div class="skeleton" style="width: 40%"></div>
          </article>
        </section>

        <aside class="glass card" data-od-id="activity-panel">
          <h2 class="panel-title">Live activity</h2>
          <div class="activity">
            <div class="row" data-od-id="activity-live">
              <span class="avatar" aria-hidden="true">AR</span>
              <span class="meta">
                <span class="who">Avery R.</span>
                <span class="sub">Speaking in “Design sync”</span>
              </span>
              <span
                class="wave"
                data-od-id="live-indicator"
                role="img"
                aria-label="Speaking"
              >
                <span></span><span></span><span></span><span></span>
              </span>
            </div>
            <div class="row idle">
              <span
                class="avatar"
                aria-hidden="true"
                style="background: linear-gradient(135deg, #0f9d6b, #3bd1a2)"
                >JM</span
              >
              <span class="meta">
                <span class="who">Jordan M.</span>
                <span class="sub">Idle · 2m</span>
              </span>
              <span class="wave" role="img" aria-label="Idle">
                <span></span><span></span><span></span><span></span>
              </span>
            </div>
          </div>
        </aside>
      </div>

      <nav
        class="glass controlbar"
        data-od-id="control-bar"
        aria-label="Actions"
      >
        <button class="primary" data-od-id="control-new">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          New room
        </button>
        <button class="icon-btn" aria-label="Settings">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round" />
          </svg>
        </button>
        <button class="icon-btn" aria-label="Invite (disabled)" disabled>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M19 8v6M22 11h-6" stroke-linecap="round" />
          </svg>
        </button>
      </nav>
    </div>
  </body>
</html>
