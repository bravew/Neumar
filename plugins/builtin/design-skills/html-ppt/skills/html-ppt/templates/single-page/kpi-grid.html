<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>KPI Grid</title>
    <link rel="stylesheet" href="../../assets/fonts.css" />
    <link rel="stylesheet" href="../../assets/base.css" />
    <link
      rel="stylesheet"
      id="theme-link"
      href="../../assets/themes/minimal-white.css"
    />
    <link rel="stylesheet" href="../../assets/animations/animations.css" />
  </head>
  <body class="single">
    <div class="deck">
      <section class="slide is-active" data-title="KPIs">
        <p class="kicker">Metrics · key numbers</p>
        <h2 class="h2">What we achieved this quarter</h2>
        <div class="g4 mt-l anim-stagger-list grid" data-anim-target>
          <div class="card">
            <p class="eyebrow">Revenue</p>
            <div style="font-size: 56px; font-weight: 800">
              <span class="counter" data-to="1248">0</span>K
            </div>
            <p class="dim" style="color: var(--good)">↑ 38% YoY</p>
          </div>
          <div class="card">
            <p class="eyebrow">Active users</p>
            <div style="font-size: 56px; font-weight: 800">
              <span class="counter" data-to="82">0</span>K
            </div>
            <p class="dim" style="color: var(--good)">↑ 12% QoQ</p>
          </div>
          <div class="card">
            <p class="eyebrow">Retention</p>
            <div style="font-size: 56px; font-weight: 800">
              <span class="counter" data-to="74">0</span>%
            </div>
            <p class="dim" style="color: var(--good)">↑ 3 pts</p>
          </div>
          <div class="card">
            <p class="eyebrow">NPS</p>
            <div style="font-size: 56px; font-weight: 800">
              <span class="counter" data-to="61">0</span>
            </div>
            <p class="dim" style="color: var(--warn)">→ flat</p>
          </div>
        </div>
      </section>
    </div>
    <script src="../../assets/runtime.js"></script>
  </body>
</html>
