<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Image Grid</title>
    <link rel="stylesheet" href="../../assets/fonts.css" />
    <link rel="stylesheet" href="../../assets/base.css" />
    <link
      rel="stylesheet"
      id="theme-link"
      href="../../assets/themes/minimal-white.css"
    />
    <link rel="stylesheet" href="../../assets/animations/animations.css" />
    <style>
      .gg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 180px;
        gap: 14px;
        margin-top: 24px;
      }
      .gg .cell {
        border-radius: var(--radius);
        overflow: hidden;
        position: relative;
        box-shadow: var(--shadow);
      }
      .gg .cell span {
        position: absolute;
        inset: auto 0 0 0;
        padding: 12px 14px;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
      }
      .gg .c1 {
        background: linear-gradient(135deg, #3b6cff, #7a5cff);
        grid-column: span 2;
        grid-row: span 2;
      }
      .gg .c2 {
        background: linear-gradient(135deg, #ff7a90, #ff2742);
      }
      .gg .c3 {
        background: linear-gradient(135deg, #5ef2c6, #7aa2ff);
      }
      .gg .c4 {
        background: linear-gradient(135deg, #ffd27a, #f2a341);
      }
      .gg .c5 {
        background: linear-gradient(135deg, #c984ff, #ff5c8a);
      }
      .gg .c6 {
        background: linear-gradient(135deg, #0e1530, #24283b);
      }
      .gg .c7 {
        background: linear-gradient(135deg, #88c0d0, #5ef2c6);
        grid-column: span 2;
      }
    </style>
  </head>
  <body class="single">
    <div class="deck">
      <section class="slide is-active" data-title="Image Grid">
        <p class="kicker">Gallery · Portfolio</p>
        <h2 class="h2">One bento grid, six key visuals</h2>
        <div class="gg anim-stagger-list" data-anim-target>
          <div class="cell c1"><span>Hero visual · keynote cover</span></div>
          <div class="cell c2"><span>Warm · stat</span></div>
          <div class="cell c3"><span>Cool · flow</span></div>
          <div class="cell c4"><span>Sunset · code</span></div>
          <div class="cell c5"><span>Gradient · quote</span></div>
          <div class="cell c6"><span>Dark · terminal</span></div>
          <div class="cell c7"><span>Aurora · CTA</span></div>
        </div>
      </section>
    </div>
    <script src="../../assets/runtime.js"></script>
  </body>
</html>
