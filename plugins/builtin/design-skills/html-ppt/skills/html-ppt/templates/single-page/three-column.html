<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Three Column</title>
    <link rel="stylesheet" href="../../assets/fonts.css" />
    <link rel="stylesheet" href="../../assets/base.css" />
    <link
      rel="stylesheet"
      id="theme-link"
      href="../../assets/themes/minimal-white.css"
    />
    <link rel="stylesheet" href="../../assets/animations/animations.css" />
  </head>
  <body class="single">
    <div class="deck">
      <section class="slide is-active" data-title="Three column">
        <p class="kicker">Pillars · three supports</p>
        <h2 class="h2">One html-ppt, three tools</h2>
        <div class="g3 mt-l anim-stagger-list grid" data-anim-target>
          <div class="card">
            <div style="font-size: 40px">🎨</div>
            <h4 class="mt-s">Themes</h4>
            <p class="dim">
              Restrained, editorial, neon, or terminal styles that change by
              scene.
            </p>
          </div>
          <div class="card">
            <div style="font-size: 40px">🧱</div>
            <h4 class="mt-s">Layouts</h4>
            <p class="dim">30 page types, from cover to closing.</p>
          </div>
          <div class="card">
            <div style="font-size: 40px">✨</div>
            <h4 class="mt-s">Animations</h4>
            <p class="dim">25 named animations，、。</p>
          </div>
        </div>
      </section>
    </div>
    <script src="../../assets/runtime.js"></script>
  </body>
</html>
