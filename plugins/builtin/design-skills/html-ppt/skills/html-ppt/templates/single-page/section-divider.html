<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Section Divider</title>
    <link rel="stylesheet" href="../../assets/fonts.css" />
    <link rel="stylesheet" href="../../assets/base.css" />
    <link
      rel="stylesheet"
      id="theme-link"
      href="../../assets/themes/minimal-white.css"
    />
    <link rel="stylesheet" href="../../assets/animations/animations.css" />
  </head>
  <body class="single">
    <div class="deck">
      <section class="slide is-active tc center" data-title="Section 02">
        <div style="max-width: 780px; margin: 0 auto">
          <p class="kicker anim-fade-down" data-anim="fade-down">
            Section · 02
          </p>
          <h1
            class="h1 anim-rise-in"
            data-anim="rise-in"
            style="font-size: 112px"
          >
            Themes and <span class="gradient-text">Tokens</span>
          </h1>
          <div class="divider-accent" style="margin: 24px auto"></div>
          <p class="lede" style="margin: 0 auto">
            Changing themes means swapping CSS variables. Everything else stays
            the same.
          </p>
        </div>
      </section>
    </div>
    <script src="../../assets/runtime.js"></script>
  </body>
</html>
