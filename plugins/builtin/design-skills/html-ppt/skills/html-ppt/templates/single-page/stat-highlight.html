<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Stat Highlight</title>
    <link rel="stylesheet" href="../../assets/fonts.css" />
    <link rel="stylesheet" href="../../assets/base.css" />
    <link
      rel="stylesheet"
      id="theme-link"
      href="../../assets/themes/minimal-white.css"
    />
    <link rel="stylesheet" href="../../assets/animations/animations.css" />
  </head>
  <body class="single">
    <div class="deck">
      <section class="slide is-active center tc" data-title="Stat">
        <p class="kicker">Impact · one number</p>
        <div
          style="
            font-size: 260px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -0.05em;
          "
        >
          <span class="counter gradient-text" data-to="92">0</span
          ><span class="gradient-text">%</span>
        </div>
        <h3 class="mt-s">of preparation time saved</h3>
        <p class="lede" style="margin: 16px auto 0">
          Across 10 real projects, average deck production time dropped from 4
          hours to 20 minutes with html-ppt.
        </p>
      </section>
    </div>
    <script src="../../assets/runtime.js"></script>
  </body>
</html>
