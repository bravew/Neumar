name: CI

# ABOUT THIS WORKFLOW
# - Purpose: Validate code quality, type safety, formatting, and tests before merge.
# - Trigger: Every non-draft pull request regardless of base branch (main, release/*,
#   epic/**), including dependency-bot PRs; pushes to main and epic/** so the integrated
#   head is validated; and manual workflow_dispatch. Draft PRs skip the heavy jobs until
#   they are marked ready for review.
# - Jobs: quality (lint/types/format), test (frontend+API), build verification, plus the
#   checks `pnpm validate` does not cover: API lint, API test-file typecheck, the shared
#   video IR suite, and Rust checks on a change that touches src-tauri/. `CI Gate` is the
#   single aggregate job that branch protection should require. It passes only when every
#   required job succeeded. A skipped or cancelled required job is a failure. The only
#   accepted skips are a draft PR (GitHub cannot merge drafts), Browser E2E when it was
#   not requested via workflow_dispatch, and Rust checks when src-tauri/ did not change.
# - Caching: pnpm store cached via actions/setup-node built-in cache support.
#
# CUSTOMIZATION TIPS
# - To add E2E tests, change `pnpm test:fast` to `pnpm test:ci` (adds E2E suite, slower).
# - Coverage thresholds are configured in vitest configs, not here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'epic/**']
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run full test suite including E2E (slower)
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Quality Gate ────────────────────────────────────────────
  quality:
    name: Lint, Types & Format
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      # Full history so base-aware gates (warning baseline, component size) can
      # resolve the PR base ref instead of falling back or skipping.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Brand check
        run: pnpm brand:check

      - name: Lint
        run: pnpm lint

      - name: Type check (frontend + API)
        run: pnpm typecheck:all

      - name: Component size check
        run: pnpm check:component-size

      - name: Format check
        run: pnpm format:check

  # ─── Test Suite ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run tests
        env:
          RUN_E2E: ${{ github.event.inputs.run_e2e }}
        run: |
          if [ "$RUN_E2E" = "true" ]; then
            pnpm test:ci
          else
            pnpm test:fast
            pnpm test:gate
          fi

      - name: Select evals
        run: pnpm eval:select --json > selected-evals.json

      - name: Upload eval selection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: selected-evals
          path: selected-evals.json
          retention-days: 14

  # ─── Extended Checks ─────────────────────────────────────────
  # `pnpm validate` does not run API lint, API test-file typechecking, the
  # shared video IR suite, or Rust checks. #102/#103/#105 reached main with API
  # test type errors for exactly that reason. These jobs report individually so
  # "validate passed" never implies a check that did not run.
  api-checks:
    name: API Lint & Test Typecheck
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API lint
        run: pnpm --filter neumar-api lint

      - name: API source and test type check
        run: pnpm --filter neumar-api exec tsc -p tsconfig.json --noEmit

  video-ir:
    name: Video IR Suite
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Shared video IR tests and validation
        run: |
          pnpm --filter @neumar/video-ir test
          pnpm --filter @neumar/video-ir validate

  # ─── Rust Checks (changed surface only) ──────────────────────
  # Only meaningful when src-tauri/ changed. The detection step decides, and the
  # job reports `skipped` otherwise. `CI Gate` accepts that one skip and nothing
  # else from this job.
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect src-tauri changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA"...HEAD -- src-tauri/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skip reason
        if: steps.changed.outputs.changed != 'true'
        run: echo "::notice::No src-tauri/ changes in this PR; Rust checks skipped."

      - name: Setup pnpm
        if: steps.changed.outputs.changed == 'true'
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        if: steps.changed.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust format check
        if: steps.changed.outputs.changed == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust check
        if: steps.changed.outputs.changed == 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  # ─── Browser E2E (Playwright) ────────────────────────────────
  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event.inputs.run_e2e == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The Playwright webServer spawns the API + vite, both of which import
      # @neumar/video-ir via its built `lib/` (exports → ./lib/index.js). Unlike
      # the test job (built by its pretest hooks), this job must build it
      # explicitly or both servers crash with ERR_MODULE_NOT_FOUND on startup.
      - name: Build workspace packages
        run: pnpm --filter @neumar/video-ir build

      - name: Run Playwright tests
        run: pnpm test:e2e:browser
        env:
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── Build Verification ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ─── Aggregate Gate ──────────────────────────────────────────
  # Stable required check. Runs even when upstream jobs fail, skip, or are cancelled.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      [quality, test, api-checks, video-ir, rust-checks, browser-e2e, build]
    if: always()

    steps:
      - name: Evaluate required jobs
        env:
          IS_DRAFT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          RUN_E2E: ${{ github.event.inputs.run_e2e }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          API_CHECKS_RESULT: ${{ needs.api-checks.result }}
          VIDEO_IR_RESULT: ${{ needs.video-ir.result }}
          RUST_RESULT: ${{ needs.rust-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          if [ "$IS_DRAFT_PR" = "true" ]; then
            echo "::notice::Draft pull request: required jobs are skipped until it is marked ready for review. GitHub cannot merge a draft."
            exit 0
          fi

          status=0
          require() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 finished as '$2', expected '$3'."
              status=1
            fi
          }

          require "Lint, Types & Format" "$QUALITY_RESULT" success
          require "Test" "$TEST_RESULT" success
          require "API Lint & Test Typecheck" "$API_CHECKS_RESULT" success
          require "Video IR Suite" "$VIDEO_IR_RESULT" success
          require "Build" "$BUILD_RESULT" success

          # Rust Checks may be skipped only when src-tauri/ did not change; the
          # job's own detection step reports the reason.
          if [ "$RUST_RESULT" != "success" ] && [ "$RUST_RESULT" != "skipped" ]; then
            echo "::error::Rust Checks finished as '$RUST_RESULT', expected 'success' or a src-tauri-scoped skip."
            status=1
          fi

          if [ "$RUN_E2E" = "true" ]; then
            require "Browser E2E" "$BROWSER_E2E_RESULT" success
          else
            require "Browser E2E (not requested)" "$BROWSER_E2E_RESULT" skipped
          fi

          exit "$status"
