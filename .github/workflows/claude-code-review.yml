name: Claude - Diff-Aware PR Reviewer

# ABOUT THIS WORKFLOW
# - Purpose: Generate a thorough, diff-aware code review for PRs with inline comments and summary.
# - Trigger: Manual — workflow_dispatch, commenting "@review" on a PR, or adding the "review" label.
#   (Automatic pull_request trigger on every open/sync is disabled by default — see the `on:` block.)
# - Outputs: A single summary comment (updated in-place) + optional inline comments + optional report artifact.
# - Docs: https://github.com/anthropics/claude-code-action
#
# TRIGGERS AND LABELS
# - The "review" and "skip AI review" labels must already exist in the repository. A
#   workflow cannot create labels, and a missing trigger label fails silently: no event
#   is delivered, so no run appears. Create both labels before relying on them.
# - The "skip AI review" label is honored on workflow_dispatch by the Resolve skip label
#   step, because job-level `if` cannot read PR labels on that event.
#
# REPOSITORY_DISPATCH IS NOT SUPPORTED YET
# - The automated publisher (#362) cannot request a review with a repository_dispatch
#   "ai-review" event, so the trigger was removed. At the pinned claude-code-action SHA,
#   `validateTrackProgressEvent` (src/modes/detector.ts) throws for every event except
#   pull_request, issues, issue_comment, pull_request_review_comment and
#   pull_request_review, so `track_progress: true` fails the step on repository_dispatch
#   before Claude starts. The same check rejects workflow_dispatch; that path is not
#   changed here.
# - Supporting a dispatch needs a review comment bound explicitly to the PR number: the
#   minimize step, the rework count and the completion guard all key on the claude[bot]
#   tracking comment that `track_progress` creates, and a dispatch has no such comment.
# - `allowed_bots` on the Claude Code Review step must be set to the publisher App's
#   username once that App is installed, or the action rejects the bot actor. That is a
#   permission grant, so it is deliberately not set here and needs explicit approval.
#
# REVISION-BOUND EVIDENCE
# - Every review is bound to the exact head it reviewed. The "Collect revision and CI
#   evidence" step records headRefOid, baseRefOid, the check runs for that head, and the
#   actual `CI Gate` conclusion and URL. The prompt requires that block verbatim in
#   review.md, and the completion guard rejects a posted review that does not stamp the
#   captured head or that reports `ready-for-human` while CI is unverified.
# - The guard re-reads the PR head before accepting the review. If the head moved while
#   the review ran, the old review is invalid and a fresh run is required.
#
# VERDICT AND BOUNDED REWORK
# - The review ends with exactly one verdict: `ready-for-human`, `request-changes`, or
#   `needs-decision`. `ready-for-human` only means the static review found no blocking
#   findings; a human (`bravew`) still makes the merge decision. It is never an approval.
# - Automated rework is bounded at 3 request-changes cycles (`MAX_REWORK_CYCLES` in
#   `scripts/verify-pr-gate.mjs`). Once reached, the next verdict must be
#   `needs-decision`; the workflow does not label or mutate the PR itself.
#
# EXCLUDED PATHS
# - `REVIEW_EXCLUDE_PATHS` removes docs, markdown, and lockfiles from the diff. When every
#   changed path is excluded, the scoped diff is empty. That is not a pass: the evidence
#   block lists every excluded path and requires a human review of them.
#
# REQUIRED SECRETS
# - CLAUDE_CODE_OAUTH_TOKEN: Claude Code OAuth token for authentication.
#
# PERMISSIONS EXPLAINED
# - contents: read - Read repository code and PR diffs
# - pull-requests: write - Post PR comments and inline review comments
# - issues: read - Read linked issues for context
# - id-token: write - Required by the action runtime
# - actions: read - Read CI results to provide context-aware reviews
# - checks: read - Read the check runs for the exact head and stamp CI evidence
#
# CUSTOMIZATION TIPS
# - Adjust --allowedTools to restrict/enable commands. Keep the scope tight.
# - Update the prompt sections to match your team's review style.
# - Use track_progress: true for visual progress during long reviews.
# - Override CLAUDE_MODEL via workflow_dispatch input or set in repository variables
#   (defaults to claude-sonnet-5) https://platform.claude.com/docs/en/about-claude/models/overview
# - Enable extended thinking via workflow_dispatch input for deeper analysis (use_extended_thinking=true)
# - Enable inline comments via workflow_dispatch input or repository variable (enable_inline_comments=true)
# - Tune which paths are excluded from the reviewed diff via the REVIEW_EXCLUDE_PATHS repository variable.
#
# LARGE-PR DIFF HANDLING
# - `gh pr diff` goes through the GitHub API, which returns HTTP 406 ("diff exceeded the maximum
#   number of lines (20000)") on big PRs — and `gh pr diff --name-only` swallows that error and
#   exits 0 with empty output. A review that depends on it silently gets nothing to review.
# - So the diff is computed locally instead: fetch the base branch and refs/pull/<N>/head, then
#   `git diff --merge-base`, with noise paths (docs, lockfiles) excluded via pathspecs. No API
#   line cap applies. Results are written to pr-diff.patch / pr-files.txt for Claude to read.
# - Only `git fetch` and `git diff` touch the PR head. No PR code is ever executed by this workflow.
#
# SUMMARY COMMENT BEHAVIOR
# - track_progress: true makes the action create one tracking comment per run, authored by
#   claude[bot], and Claude edits it in place via mcp__github_comment__update_claude_comment.
# - Do NOT reintroduce a `gh pr comment --edit-last` wrapper here: that runs as github-actions[bot],
#   so --edit-last cannot see the claude[bot] tracking comment and posts a duplicate instead.
# - Previous claude[bot] summary and inline comments are minimized (collapsed) as OUTDATED before
#   each run, so the PR conversation keeps only the current review expanded.
#
# COMPLETION GUARD
# - A run counts as complete only when both are true: review.md ends with the
#   <!-- claude-review-complete --> marker (Claude finished writing), and this run's claude[bot]
#   comment contains review.md's longest line (what it wrote reached the PR). Neither alone is
#   enough — run 34312666877 ended with a summary it never posted.
# - The marker is checked on the FILE, never on the comment: update_claude_comment strips HTML
#   comments from the body it posts. Run 34356058557 posted a complete review, byte-identical to
#   review.md except the stripped marker, and an earlier version of this guard rejected it.
#   GitHub preserves HTML comments (CodeRabbit's comments keep five) — the sanitizing is the
#   action's, so the marker lives where it survives and the comment is matched on visible text.
# - "This run's comment" is identified two independent ways — absent from the pre-run comment
#   snapshot, or stamped with the run id — so neither an action version that reformats tracking
#   comments nor a missing snapshot can make the guard fail closed on every run.
# - No marker means the job fails. If review.md exists it is salvaged into a comment so a partial
#   review still reaches the PR; otherwise an explicit failure notice is posted. Either way a
#   half-finished review can never masquerade as a green check.
# - Guard notices carry <!-- claude-review-guard --> so the next run collapses them.
#
# EXPECTED LOG NOISE
# - The run log carries a burst of "fatal: could not open <path> ... No such file or directory",
#   often hundreds of lines. They are not from this workflow and not a failure. The action's own
#   fetchGitHubData (src/github/data/fetcher.ts, during prepareTagMode, before Claude starts) runs
#   `git hash-object` over every changed file. Checkout is pinned to the base revision (main on
#   issue_comment/workflow_dispatch), so files the PR *adds* are not on disk
#   and cannot be hashed. The action catches
#   each one, logs "warn: Failed to compute SHA", and continues. "fatal:" is git's prefix for every
#   error, not a job status.
# - Those SHAs only feed inline-comment anchoring. Silencing them would mean checking out the PR
#   head, which this workflow deliberately does not do — see SECURITY below.
#
# SECURITY
# - This workflow does not modify source code. It only posts comments and writes reports.

on:
  # Automatic pull_request trigger on every open/sync is disabled by default.
  # Uncomment the two lines below to restore it. Until then, trigger a review
  # by: workflow_dispatch (Actions tab or `gh workflow run`), commenting
  # "@review" on the PR, or adding the "review" label.
  # pull_request:
  #   types: [opened, synchronize, reopened, ready_for_review, unlabeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
      post_comment:
        description: Post summary comment on PR (true/false)
        default: 'true'
      generate_report:
        description: Generate markdown report artifact (true/false)
        default: 'true'
      claude_model:
        description: Claude model to use (e.g., claude-opus-5, https://platform.claude.com/docs/en/about-claude/models/overview)
        required: false
      use_extended_thinking:
        description: Enable extended thinking for deeper analysis (true/false)
        required: false
        default: 'false'
      enable_inline_comments:
        description: Enable inline review comments on specific lines (true/false)
        required: false
        default: 'false'

# Environment variables (can be overridden via workflow_dispatch or repository settings)
env:
  CLAUDE_MODEL: ${{ github.event.inputs.claude_model || vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
  ENABLE_EXTENDED_THINKING: ${{ github.event.inputs.use_extended_thinking || vars.ENABLE_EXTENDED_THINKING || 'false' }}
  ENABLE_INLINE_COMMENTS: ${{ github.event.inputs.enable_inline_comments || vars.ENABLE_INLINE_COMMENTS || 'false' }}
  # Space-separated git pathspecs excluded from the reviewed diff. Prose and generated
  # lockfiles crowd out code without carrying review-worthy findings.
  REVIEW_EXCLUDE_PATHS: ${{ vars.REVIEW_EXCLUDE_PATHS || ':(exclude)dev-doc/** :(exclude)**/*.md :(exclude)pnpm-lock.yaml :(exclude)package-lock.json :(exclude)yarn.lock :(exclude)**/*.snap' }}
  # The heading that marks a posted comment as a finished review rather than a progress
  # checklist. The prompt mandates it and the completion guard looks for it, so it is defined
  # once here — if it drifts in one place the review silently stops being verifiable.
  REVIEW_REQUIRED_SECTION: ${{ vars.REVIEW_REQUIRED_SECTION || 'Layer Summary' }}
  # Turn budget for the review session. Without an explicit cap a large PR can exhaust the
  # default budget mid-analysis and end "successfully" without ever posting a summary.
  # This is a runtime backstop only — it is deliberately NOT told to the model. Run 34356058557
  # was asked to track its own budget and stopped at 39 of 80 turns, self-reporting "(budget)"
  # as the reason it skipped files, because a model cannot observe its own turn count and so
  # guesses conservatively. The prompt now tells it not to ration.
  REVIEW_MAX_TURNS: ${{ vars.REVIEW_MAX_TURNS || '80' }}

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read
  checks: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Runs on: workflow_dispatch, adding the "review" label, or a collaborator
    # commenting "@review" on the PR. Skips automated dependency-update bots. The
    # label triggers check the "skip AI review" label here; workflow_dispatch
    # checks it in the Resolve skip label step because job-level `if` cannot read
    # PR labels.
    if: |
      !contains(github.actor, 'dependabot') &&
      !contains(github.actor, 'renovate') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'review' &&
          !contains(github.event.pull_request.labels.*.name, 'skip AI review')
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@review') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          !contains(github.event.issue.labels.*.name, 'skip AI review')
        )
      )
    # Keep this at job level so unrelated issue comments that skip the job
    # cannot cancel an active review for the same PR.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Never check out the PR head: this job holds CLAUDE_CODE_OAUTH_TOKEN and
          # pull-requests: write, and the verifier script must come from trusted code.
          # On pull_request events this is the base SHA; on dispatch and comment
          # events github.sha is the default branch.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          # Depth 100 gives `git merge-base` enough history to resolve the fork point
          # against the PR head fetched below. The "Prepare scoped PR diff" step deepens
          # further if that isn't enough for a long-lived branch.
          fetch-depth: 100

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22

      - name: Set PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_GENERATE_REPORT: ${{ inputs.generate_report }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_PR_NUMBER" >> $GITHUB_OUTPUT
            echo "generate_report=$INPUT_GENERATE_REPORT" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            echo "number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
            echo "generate_report=false" >> $GITHUB_OUTPUT
          else
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "generate_report=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve skip label
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::No numeric PR number was resolved for event $GITHUB_EVENT_NAME."
            exit 1
          fi

          # The label triggers already exclude "skip AI review" in the job `if`.
          # workflow_dispatch cannot read labels there, so honor the opt-out here.
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if printf '%s\n' "$LABELS" | grep -qxF 'skip AI review'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR_NUMBER carries the 'skip AI review' label; review skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Minimize previous Claude review comments
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Snapshot which claude[bot] comments already exist. The completion guard uses this
          # to identify the comment *this* run posted, so it does not depend solely on the
          # action stamping the run id into the tracking comment — an internal formatting
          # detail that could change between action versions. Anything not in this list is
          # new, and the job-level concurrency group means no other review run can be posting
          # concurrently on this PR.
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            > pre-run-claude-comments.txt
          echo "claude[bot] comments before this run: $(wc -l < pre-run-claude-comments.txt | tr -d ' ')"

          minimize() {
            gh api graphql -f query='
              mutation($id: ID!) {
                minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                  minimizedComment { isMinimized }
                }
              }' -f id="$1" >/dev/null 2>&1 || true
          }

          # `if` rather than `[ -n ... ] && ...` on purpose: a false `&&` chain would be the
          # loop's exit status, and under `pipefail` that aborts the whole step.
          # Collapse previous inline review comments from earlier runs.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]" or .user.login == "claude" or .user.login == "github-actions[bot]") | .node_id' \
            | while read -r node_id; do
                if [ -n "$node_id" ]; then minimize "$node_id"; fi
              done

          # Collapse previous summary/tracking comments too. Without this, a run that dies
          # mid-review leaves an unchecked "in progress" checklist sitting on the PR forever,
          # indistinguishable from a review that is still running.
          #
          # Also collapse this workflow's own guard notices from earlier runs — they are
          # posted by github-actions[bot], so filtering on claude[bot] alone would leave a
          # stale "review did not complete" notice on the PR after a later run succeeds.
          # Matched by marker, not by author, so other workflows' comments stay expanded.
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
                  | select(.user.login == "claude[bot]"
                           or (.body | contains("<!-- claude-review-guard -->")))
                  | .node_id' \
            | while read -r node_id; do
                if [ -n "$node_id" ]; then minimize "$node_id"; fi
              done

      - name: Prepare scoped PR diff
        id: diff
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          EXCLUDES: ${{ env.REVIEW_EXCLUDE_PATHS }}
        run: |
          set -euo pipefail

          BASE_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName --jq '.baseRefName')
          echo "Base branch: $BASE_REF"

          # Fetch the base branch and the PR head as read-only refs. Nothing from the PR head
          # is ever executed — only `git diff` reads these trees.
          git fetch --no-tags --depth=100 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

          # Deepen until the fork point is reachable; shallow clones can miss it on
          # long-lived branches.
          for depth in 250 1000; do
            if git merge-base "refs/remotes/origin/${BASE_REF}" refs/remotes/pr/head >/dev/null 2>&1; then
              break
            fi
            echo "Merge base not reachable, deepening to $depth..."
            git fetch --no-tags --deepen="$depth" origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" || true
          done

          if ! git merge-base "refs/remotes/origin/${BASE_REF}" refs/remotes/pr/head >/dev/null 2>&1; then
            echo "::error::Could not resolve a merge base between $BASE_REF and PR #$PR_NUMBER."
            exit 1
          fi

          # Record the exact commit the diff is computed from. refs/pull/N/head moves
          # when the PR is pushed, so this SHA, not a later API read, is what the
          # review is bound to. The evidence step aborts if PR metadata disagrees.
          DIFF_HEAD=$(git rev-parse --verify "refs/remotes/pr/head^{commit}")
          echo "head_sha=$DIFF_HEAD" >> "$GITHUB_OUTPUT"
          echo "Diff computed from PR head $DIFF_HEAD"

          # Unfiltered list, so an empty scoped diff can still name the paths that
          # were excluded instead of silently reviewing nothing.
          git diff --merge-base "refs/remotes/origin/${BASE_REF}" refs/remotes/pr/head \
            --name-only > changed-paths.txt

          # shellcheck disable=SC2086 # EXCLUDES is a deliberate list of pathspecs
          git diff --merge-base "refs/remotes/origin/${BASE_REF}" refs/remotes/pr/head \
            --stat=200 -- . $EXCLUDES > pr-files.txt
          # shellcheck disable=SC2086
          git diff --merge-base "refs/remotes/origin/${BASE_REF}" refs/remotes/pr/head \
            -- . $EXCLUDES > pr-diff.patch

          PATCH_LINES=$(wc -l < pr-diff.patch | tr -d ' ')
          FILE_COUNT=$(grep -c '^diff --git ' pr-diff.patch || true)
          TOTAL_FILE_COUNT=$(wc -l < changed-paths.txt | tr -d ' ')
          echo "patch_lines=$PATCH_LINES" >> "$GITHUB_OUTPUT"
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_file_count=$TOTAL_FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Scoped diff: $FILE_COUNT files, $PATCH_LINES patch lines (of $TOTAL_FILE_COUNT changed paths)"

          if [ "$PATCH_LINES" -eq 0 ] && [ "$TOTAL_FILE_COUNT" -gt 0 ]; then
            # Every changed path matched REVIEW_EXCLUDE_PATHS. This is not a pass:
            # the evidence block lists the paths and requires a human review.
            echo "all_excluded=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Scoped diff is empty because all $TOTAL_FILE_COUNT changed path(s) matched REVIEW_EXCLUDE_PATHS."
          else
            echo "all_excluded=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$PATCH_LINES" -gt 12000 ]; then
            echo "::warning::Scoped diff is $PATCH_LINES lines across $FILE_COUNT files. Expect a partial review — split the PR, widen REVIEW_EXCLUDE_PATHS, or rerun with claude_model=claude-opus-5."
          fi

      - name: Collect revision and CI evidence
        id: evidence
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          DIFF_HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
        run: |
          set -euo pipefail

          # The verifier is trusted code from the checked-out base revision. Never
          # execute a script from the PR head in this job: it holds the OAuth token
          # and pull-requests: write.
          if [ ! -f scripts/verify-pr-gate.mjs ]; then
            echo "::error::scripts/verify-pr-gate.mjs is missing from the checked-out base revision. Merge the verifier before relying on revision-bound evidence."
            exit 1
          fi

          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json number,url,state,isDraft,headRefOid,baseRefOid,mergeCommit,mergeStateStatus,labels \
            > pr-metadata.json
          # One metadata read supplies the head, so the evidence and the comparison
          # below cannot disagree with each other.
          HEAD_SHA=$(jq -r '.headRefOid' pr-metadata.json)

          # The review is bound to the commit the diff was fetched from. If the PR
          # moved between the diff fetch and this read, the diff and the CI evidence
          # would describe two different heads, so abort and require a fresh run.
          if [ -z "$DIFF_HEAD_SHA" ] || [ "$HEAD_SHA" != "$DIFF_HEAD_SHA" ]; then
            echo "::error::PR #$PR_NUMBER head moved while the review was prepared: the diff was fetched from '${DIFF_HEAD_SHA:-unknown}' but PR metadata reports '$HEAD_SHA'. Re-run the review."
            exit 1
          fi
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Check runs for the exact head, not for whatever head happened to be
          # current when an earlier review ran.
          gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" > check-runs.json

          ALL_EXCLUDED='${{ steps.diff.outputs.all_excluded }}'

          # Prior request-changes cycles bound automated rework. This run's comment
          # does not exist yet, so it is not counted.
          REWORK_CYCLES=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body' \
            | { grep -oF 'Verdict: `request-changes`' || true; } | wc -l | tr -d ' ')
          echo "rework_cycles=$REWORK_CYCLES" >> "$GITHUB_OUTPUT"
          if [ "$REWORK_CYCLES" -ge 3 ]; then
            echo "rework_limit_reached=true" >> "$GITHUB_OUTPUT"
          else
            echo "rework_limit_reached=false" >> "$GITHUB_OUTPUT"
          fi

          node scripts/verify-pr-gate.mjs evidence \
            --pr pr-metadata.json \
            --checks check-runs.json \
            --changed changed-paths.txt \
            --expected-head "$HEAD_SHA" \
            --all-excluded "$ALL_EXCLUDED" \
            --rework-cycles "$REWORK_CYCLES" \
            > review-evidence.md

          node scripts/verify-pr-gate.mjs verify \
            --pr pr-metadata.json \
            --checks check-runs.json \
            --changed changed-paths.txt \
            --expected-head "$HEAD_SHA" \
            > pr-gate.json || true

          CI_VERIFIED=$(node -p 'JSON.parse(require("fs").readFileSync("pr-gate.json","utf8")).ok ? "yes" : "no"')
          echo "ci_verified=$CI_VERIFIED" >> "$GITHUB_OUTPUT"
          echo "CI verified on $HEAD_SHA: $CI_VERIFIED"

      - name: Claude Code Review
        id: claude
        if: steps.skip.outputs.skip != 'true'
        uses: anthropics/claude-code-action@5ccc3a35a6367cdb8e6fbd0728287467540ecfe2 # v1 (v1.0.219)
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOTE: `allowed_bots` is intentionally unset. It must name the publisher App's
          # username once that App is installed, and setting it is a permission grant that
          # needs explicit approval. See "REPOSITORY_DISPATCH IS NOT SUPPORTED YET" above.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}
            GENERATE REPORT: ${{ steps.pr.outputs.generate_report }}
            CLAUDE_MODEL: ${{ env.CLAUDE_MODEL }}
            ENABLE_EXTENDED_THINKING: ${{ env.ENABLE_EXTENDED_THINKING }}
            ENABLE_INLINE_COMMENTS: ${{ env.ENABLE_INLINE_COMMENTS }}
            DIFF FILE COUNT: ${{ steps.diff.outputs.file_count }}
            DIFF PATCH LINES: ${{ steps.diff.outputs.patch_lines }}
            TOTAL CHANGED PATHS: ${{ steps.diff.outputs.total_file_count }}
            ALL CHANGED PATHS EXCLUDED: ${{ steps.diff.outputs.all_excluded }}
            REVIEWED HEAD SHA: ${{ steps.evidence.outputs.head }}
            CI VERIFIED ON EXACT HEAD: ${{ steps.evidence.outputs.ci_verified }}
            AUTOMATED REWORK CYCLES SO FAR: ${{ steps.evidence.outputs.rework_cycles }}
            REWORK LIMIT REACHED: ${{ steps.evidence.outputs.rework_limit_reached }}

            You are a senior engineer reviewing application — a desktop AI agent app built with three layers:
            - **Frontend** (`src/`): React 19 + TypeScript 6 + Vite 8 + Tailwind CSS 4 + Radix UI
            - **Backend API** (`src-api/`): Node.js + Hono 4 + Claude Agent SDK + Zod 4
            - **Desktop Shell** (`src-tauri/`): Tauri 2 + Rust + SQLite

            The app executes natural language tasks via AI agents with a two-phase flow (planning → execution).

            ## Revision-bound evidence (READ BEFORE THE DIFF)

            `review-evidence.md` was generated by the workflow, not by you. Read it and copy its
            `## Revision Evidence` block verbatim into `review.md`. It records the exact reviewed
            head, base, focused check results, the actual `CI Gate` conclusion and URL, and the
            unverified gaps. Do not paraphrase or recompute those values.

            - If `ALL CHANGED PATHS EXCLUDED` is `true`, the scoped diff is empty because every
              changed path matched `REVIEW_EXCLUDE_PATHS`. Add a `## No reviewable code changes`
              section that lists every path from `changed-paths.txt` and states that a human must
              review them. Do not claim the code was reviewed, and do not call it a pass.
            - If `CI VERIFIED ON EXACT HEAD` is not `yes`, the verdict must be `request-changes`.
            - If `REWORK LIMIT REACHED` is `true`, the verdict must be `needs-decision`; do not ask
              for another automated cycle.

            ## How to read the diff (READ THIS FIRST)

            The diff is already prepared for you on disk. Do NOT run `gh pr diff` — it returns
            HTTP 406 on PRs over 20,000 diff lines, and `--name-only` hides that failure behind
            exit code 0, leaving you with nothing.

            - `pr-files.txt` — per-file change summary (name + churn). Start here, always.
            - `pr-diff.patch` — the full scoped patch. Docs, markdown, and lockfiles are already
              excluded, so everything in it is code worth reading.

            If `pr-diff.patch` is too large to read in one call, read it in chunks with the Read
            tool's offset/limit parameters, working through the files you prioritized from
            `pr-files.txt`. Use Read/Glob/Grep on the checked-out tree for surrounding context only
            when that tree is the PR head; on comment and dispatch triggers it is the base revision.

            ### Line numbers: a position in the patch is NOT a source line

            `pr-diff.patch` concatenates every file, so a finding on line 14342 of the patch may sit
            at line 128 of a 143-line source file. Citing the patch offset sends the reader to a
            line that does not exist. Earlier runs of this workflow did exactly that.

            To cite a real line, use the enclosing hunk header:

            ```
            @@ -12,7 +12,9 @@       <- +12 is the first new-file line in this hunk
            ```

            Count added (`+`) and context (` `) lines from that start, ignoring removed (`-`) lines.
            When a hunk is long or you are unsure, derive the number from the hunk header. Only
            `Read` the checked-out tree if it is the PR head; on comment and dispatch triggers it is
            the base revision, not the PR's code.

            If you still cannot pin a line, cite the symbol instead (`applyReviewAction()` in
            `review.ts`). A correct file-and-symbol beats a confident wrong number.

            ## Working constraints (violating these is how reviews end up empty)

            - **You are a single agent.** Subagents and the Task tool are NOT available. Do not
              plan "parallel passes" or announce a fan-out — every such attempt is denied and
              wastes a turn. Work sequentially through the prioritized file list.
            - **Do not ration your own effort.** You cannot see how many turns you have used, so
              any guess is wrong, and guessing low means stopping with the review half done. A
              hard cap is enforced for you by the runtime — you do not need to manage it. Keep
              reviewing until the prioritized list is genuinely covered.
            - **Only these commands are available**: `gh pr view`, `gh pr checks`, `cat CLAUDE.md`,
              `mkdir -p reports`. Anything else is denied — don't retry a denied command.
            - **Triage before reading.** If the diff is larger than you can fully cover, prioritize:
              security-sensitive code → backend/agent logic → React state and effects → i18n parity
              → everything else. Say what you did not cover in the summary.

            ## Review Focus Areas

            ### React & Frontend

            **Hooks Rules (CRITICAL)**
            - Hooks called conditionally or after early returns — React will crash at runtime
            - Missing `useEffect` cleanup: uncanceled AbortControllers, uncleared timers, unremoved event listeners → memory leaks
            - Stale closures: missing dependencies in `useEffect`/`useCallback`/`useMemo` arrays cause reading outdated values
            - Unnecessary dependencies causing re-runs (e.g., object/array literals created inline in deps)
            - With React 19 compiler, manual `useMemo`/`useCallback` is less needed — flag over-memoization of simple computations (arithmetic, string ops) but DO allow it for expensive computations (large array operations, complex algorithms)

            **React 19 Specific Pitfalls**
            - `use(promise)` inside a `try/catch` block — it integrates with Suspense/ErrorBoundary, try-catch bypasses that mechanism
            - Promises created directly in Client Component render body and passed to `use()` — recreated every render, use Server Components or lift outside render
            - `useFormStatus()` called in the same component that renders the `<form>` — it only reads status from a **parent** form, must be called from a child component
            - `useActionState` dispatch called outside a Transition or `<form action={...}>` — async actions must run inside a Transition or React throws

            **Component Patterns**
            - Components over 350 lines violate the project's hard limit (enforced by `scripts/check-component-size.mjs`) — flag them and name the sub-components to extract
            - Missing `aria-label` on interactive elements (buttons, inputs, links) — required by project convention
            - Conditional class merging must use `cn()`, not string concatenation
            - List rendering without stable, unique `key` props
            - IDs generated with `Date.now()` instead of `crypto.randomUUID()` — collides on rapid calls
            - Module-level constants (regex, config objects, stable props) declared inline in render — breaks memoization

            **State Management**
            - The API daemon owns SQLite; there is no browser IndexedDB fallback — NOT Redux/Zustand
            - All data flows through `src/shared/db/database.ts` → backend `/db` API → SQLite
            - Frontend state lives in React hooks (`useState`, `useRef`, `useMemo`)
            - Flag accidental state mutations in updater functions — React StrictMode double-invokes updaters, mutations cause duplicate effects
            - Reading state captured at creation time inside async/streaming callbacks instead of the `setState(prev => ...)` updater form
            - `finally` blocks that unconditionally overwrite error status set by `catch`

            **i18n**
            - User-facing strings must use the i18n system via `useLanguage()` hook → `t.section.key`
            - Locale files live in `src/config/locale/messages/{en,zh,es,fr,hi,pt}/`
            - A new string added to English MUST also be added to **all five** other locales (zh, es, fr, hi, pt). Report any key present in one locale but missing from another.
            - Flag hardcoded user-facing strings in JSX

            ### TypeScript

            - `import type` syntax MUST be used for type-only imports — project enforces this
            - Path alias `@/*` is scoped per workspace: `src/*` from the frontend tsconfig, `src-api/src/*` from `src-api/tsconfig.json`. Flag any import that crosses that boundary, and relative imports that should use `@/`
            - No `any` — use `unknown` with proper type narrowing or explicit interfaces. Also flag `as any` casts
            - Non-null assertion `!` (e.g., `array.find(...)!`) instead of proper null checks — leads to runtime TypeError
            - Discriminated unions preferred for variant types (e.g., `AgentMessage.type` field) — flag `switch` on union type without exhaustive `default: never` check
            - Magic numbers must be extracted to named constants at file top (e.g., `const REFRESH_INTERVAL = 10_000`)

            ### Backend API (Hono + Node.js)

            **Logging (CRITICAL)**
            - `src-api/` code MUST use `createLogger()` from `@/shared/utils/logger` — NEVER `console.log`/`console.warn`/`console.error`
            - Frontend `src/` code MAY use `console.warn` for dev diagnostics
            - Flag any `console.*` call in `src-api/` files

            **Workspace root (CRITICAL)**
            - `src-api/` must never use `process.cwd()` — it resolves wrong inside the Tauri sidecar. Use the session/project resolver, or `getSetting('workDir')` from `@/shared/db/operations`, then the subsystem's path validation. Do not introduce a blanket `getSetting('workDir') ?? process.cwd()` fallback.

            **API Security**
            - Hono route handlers must validate input with Zod via `zValidator()` inline in the handler chain — NOT via `app.use()` (loses TypeScript type inference on `c.req.valid()`)
            - Flag routes accepting user input without validation
            - Zod schemas must NOT use `.passthrough()` (allows unknown fields → mass assignment risk) — use `.strict()` or default stripping
            - SSE streams (`text/event-stream`) must include proper headers: `Cache-Control: no-cache`, `Connection: keep-alive`, `X-Accel-Buffering: no`
            - Workspace file operations must be confined to the user-configured workspace directory — flag path traversal risks
            - Dynamic HTTP status codes passed to `c.json()` must be typed `ContentfulStatusCode` from `hono/utils/http-status`
            - Upstream errors must forward meaningful status codes (401, 403, 502) — flag handlers that swallow them into 200
            - SSRF: user-supplied URLs passed to server-side `fetch()` must be validated — block private ranges (`10.*`, `172.16-31.*`, `192.168.*`, `169.254.*`), cloud metadata hostnames, and non-HTTPS (except localhost)
            - Sensitive data (API keys, tokens) must not be logged or returned in API responses

            **Streaming & Async Generators**
            - Agent operations use `AsyncGenerator<AgentMessage>` for streaming — ensure proper cleanup in `finally` blocks
            - SSE streams must handle client disconnection (abort signals) to prevent resource leaks
            - `for await...of` loops over generators must have try/finally cleanup
            - Flag unbounded buffering in streams without backpressure handling
            - `fetch()` inside async generators MUST receive an `AbortSignal` — otherwise in-flight requests survive generator teardown
            - `AbortSignal.timeout()` or `AbortSignal.any()` stored in long-lived scope leaks timers — create per-request

            **Agent System (Claude Agent SDK)**
            - `BaseAgent` is the abstract class; providers in `src-api/src/extensions/agent/`
            - Agent messages follow strict types: `text`, `tool_use`, `tool_result`, `result`, `error`, `plan`, etc.
            - New agent providers must implement the `IAgent` interface and register via the registry pattern
            - MCP tool definitions must have proper `inputSchema` with Zod validation
            - Flag `bypassPermissions: true` without explicit security justification — grants full autonomous system access
            - Agent execution should set `maxTurns` to prevent runaway API billing from confused/looping agents
            - Tool errors must be intercepted with structured error responses — unhandled exceptions cause Claude to retry or hallucinate

            ### Tauri / Desktop Security

            **Capabilities (CRITICAL)**
            - Tauri 2 uses a capabilities system — permissions in `src-tauri/capabilities/default.json`
            - Flag overly broad permissions (e.g., `fs:scope-home-recursive` without justification)
            - Flag `"windows": ["*"]` in capabilities — grants all windows access; each window must be explicitly named
            - Shell execute must only allow known sidecar binaries — flag `shell:allow-execute` without restricted `allow` list
            - Shell argument validators must use tight regex — flag `"validator": ".*"` which allows arbitrary command injection
            - IPC commands must validate all inputs from the WebView — treat frontend as untrusted
            - Sidecar processes must be the ONLY allowed shell executions
            - Flag permissions granted but never invoked in frontend code — unused permissions expand attack surface

            **Rust Code**
            - Tauri commands must use proper error handling (`Result<T, E>`) — no `unwrap()` in production paths
            - Database migrations in `lib.rs` must be idempotent
            - Flag `unsafe` blocks without safety comments

            ### Security (Cross-Cutting)

            - XSS: `dangerouslySetInnerHTML` usage, unsanitized user content rendered as HTML
            - Credential exposure: API keys, tokens, OAuth secrets in client-side code, logs, or error messages
            - Path traversal: file operations that don't validate against workspace boundaries
            - Command injection: shell commands constructed from user input without sanitization
            - SQL injection: raw SQL queries with string interpolation instead of parameterized queries
            - GitHub Actions: workflow expressions interpolated directly into a `run:` block — values must be passed through an `env:` block instead
            - Sensitive data in URLs or query parameters

            ### Performance

            - Missing `React.lazy()` for route-level code splitting
            - Expensive computations in render path without `useMemo`
            - Event handlers recreated on every render when passed to memoized children
            - Large dependencies imported entirely when only a subset is used (e.g., `import * as _ from 'lodash'`)
            - Barrel file (`index.ts` re-exports) used with `await import()` — Vite/Rollup cannot tree-shake dynamic barrel imports, use direct file paths
            - Same module both statically and dynamically imported — static import forces eager loading, making the dynamic import pointless

            ## Instructions

            1. Read `pr-files.txt` and build a prioritized list of files to review.
            2. Read `CLAUDE.md` for project conventions: `cat CLAUDE.md`
            3. Work through `pr-diff.patch` (in chunks if needed), analyzing for the focus areas above.
            4. **Inline Comments (conditional on ENABLE_INLINE_COMMENTS):**
               - If ENABLE_INLINE_COMMENTS is "true":
                 - Before posting ANY inline comment, check whether a similar one already exists via
                   `gh pr view ${{ steps.pr.outputs.number }} --json reviews -q '.reviews[].comments[] | select(.path == "<file>") | {line: .line, body: .body}'`
                 - Skip anything already flagged on the same line — only post NEW findings
                 - Post via `mcp__github_inline_comment__create_inline_comment` for bugs, security
                   issues, performance problems, convention violations, and Tauri capability issues
               - If ENABLE_INLINE_COMMENTS is "false":
                 - Do NOT post inline comments. Put every finding in the summary with file:line references.
            5. If GENERATE REPORT is "true", also create `reports/pr-${{ steps.pr.outputs.number }}-review.md`
               with code snippets showing violations and corrected examples as unified diffs.

            ## Completion protocol (MANDATORY)

            Write `review.md` **early and keep it current** — draft it as soon as you have triaged
            the file list, then append findings as you go. That way an unexpected stop still leaves
            a usable review on disk, which is what makes it safe to keep reviewing rather than
            stopping early to leave room. Do not save the writing for the end, and do not stop
            analyzing in order to "reserve" turns.

            When the prioritized list is covered:

            1. Finalize `review.md` so it contains:
               - The `## Revision Evidence` block copied verbatim from `review-evidence.md`,
                 including the exact `Head:`, `Base:`, `Merge commit:`, and `CI Gate:` lines.
               - Assessment: ✅ Approve / ⚠️ Request Changes / 💬 Comment
               - Issues: bulleted list grouped by severity (Critical → Warning → Info) with file:line references
               - **${{ env.REVIEW_REQUIRED_SECTION }}** (always include verbatim, even if every line says "No issues"):
                 - 🖥️ Frontend: React/TypeScript issues found (or "No issues")
                 - ⚙️ Backend: Hono/Agent/Streaming issues found (or "No issues")
                 - 🔒 Security: Tauri capabilities, credential exposure, injection risks (or "No issues")
                 - 🌐 i18n: Missing translations in any locale (or "All locales updated")
               - **Coverage**: which files you reviewed and which you did not get to
               - If `ALL CHANGED PATHS EXCLUDED` is `true`, a `## No reviewable code changes`
                 section listing every path from `changed-paths.txt`.
               - Exactly one final verdict line, in this exact form (backticks included):
                 ```
                 Verdict: `ready-for-human`
                 ```
                 Use the value `ready-for-human` only when CI is verified on the exact head and
                 no blocking findings remain. A human (`bravew`) still makes the merge decision;
                 this is not an approval and must not say the PR is approved or ready to merge.
                 Use `request-changes` when CI is not verified on the exact head or blocking
                 findings remain. Use `needs-decision` when `REWORK LIMIT REACHED` is `true`;
                 do not ask for another automated cycle.
               - The literal marker `<!-- claude-review-complete -->` as review.md's final line.
                 It marks the file as finished. The comment tool strips HTML comments, so it
                 will not appear in the posted comment — that is expected, do not work around it.
            2. Post that exact content with `mcp__github_comment__update_claude_comment`.

            If you only managed a partial review, post it anyway with a `⚠️ Partial review` heading
            and say what is missing. A partial review is useful; an unchecked progress checklist is not.

            ## Comment Formatting

            Use collapsible sections for technical details:

            ```markdown
            <details>
            <summary>🔍 Technical Explanation</summary>

            [Detailed explanation, stack traces, or additional context]

            </details>
            ```

            **Collapsible section usage:**
            - Inline: collapse detailed explanations, code examples, alternative solutions
            - Summary: collapse "Technical Details", "Code Examples", "Additional Context"
            - Keep high-level findings visible

            **Inline comment structure (example):**
            ```markdown
            ⚠️ Missing useEffect cleanup — AbortController not aborted on unmount

            <details>
            <summary>Why this leaks</summary>

            If the component unmounts before the fetch completes, the response handler
            will try to update state on an unmounted component, and the request continues
            consuming resources.

            </details>

            <details>
            <summary>Fix</summary>

            \`\`\`typescript
            useEffect(() => {
              const controller = new AbortController();
              fetch(url, { signal: controller.signal }).then(...)

              return () => controller.abort(); // cleanup
            }, [url]);
            \`\`\`

            </details>
            ```

            ## Rules
            - **NEVER post duplicate comments** - Always check existing comments first via `gh pr view`
            - **NEVER post compliments or praise** - No positive feedback in inline comments OR summary. Skip all "good job", "nice work", "well done" type comments entirely.
            - **Inline comments are ONLY for issues** - Do not comment on good code. Only flag problems that need fixing.
            - Be direct and concise - state issue, location, fix. No filler text.
            - Skip formatting nitpicks (oxlint and oxfmt handle formatting)
            - Flag real issues only: bugs, security risks, performance problems, convention violations
            - Cite file paths and line numbers when referencing code — real source lines,
              never positions in `pr-diff.patch` (see the line-numbers note above)
            - Do NOT modify source code files
            - Use collapsible sections for technical depth
            - **NEVER use `gh pr comment` or `gh pr diff`** — the summary goes through
              `mcp__github_comment__update_claude_comment`, and the diff is already on disk
            - **ALWAYS include a `${{ env.REVIEW_REQUIRED_SECTION }}` section, spelled exactly that way**, in the
              posted comment — even if only to say "No issues". It is how the workflow tells a
              finished review from an abandoned progress checklist.
            - **ALWAYS copy the `## Revision Evidence` block verbatim**, including the exact
              `Head:`, `Base:`, `Merge commit:`, and `CI Gate:` lines. A review without the captured head is
              rejected by the completion guard.
            - **ALWAYS end with exactly one `Verdict:` line.** `ready-for-human` is a handoff
              to a human merge decision, never an approval and never a merge.

          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns ${{ env.REVIEW_MAX_TURNS }}
            ${{ env.ENABLE_EXTENDED_THINKING == 'true' && '--thinking=enabled' || '' }}
            --allowedTools Read,Glob,Grep,mcp__github_comment__update_claude_comment,Bash(gh pr view:*),Bash(gh pr checks:*),Bash(cat CLAUDE.md),Write(review.md),Edit(review.md),Write(reports/*),Bash(mkdir -p reports)${{ env.ENABLE_INLINE_COMMENTS == 'true' && ',mcp__github_inline_comment__create_inline_comment' || '' }}
            --append-system-prompt "You are a senior engineer reviewing application (React 19 + Hono + Tauri 2 + Claude Agent SDK). Flag bugs, security issues, performance problems, and convention violations. Be direct and concise - no compliments, no filler. SINGLE AGENT: subagents and the Task tool are unavailable — never plan parallel passes, work sequentially. DIFF: read pr-files.txt then pr-diff.patch from disk; never run 'gh pr diff' (HTTP 406 on large PRs). LINE NUMBERS: a position in pr-diff.patch is not a source line — derive real lines from the enclosing '@@ -old,+new @@' hunk header; only read the checked-out tree when it is the PR head (comment and dispatch triggers check out the base), and cite the symbol name when unsure. EVIDENCE: read review-evidence.md and copy its '## Revision Evidence' block verbatim into review.md, including the exact Head, Base, Merge commit, and CI Gate lines. VERDICT: end with exactly one line, Verdict: `ready-for-human`, Verdict: `request-changes`, or Verdict: `needs-decision`. Use ready-for-human only when CI is verified on the exact head and there are no blocking findings; it is a handoff to a human merge decision, never an approval or merge. If CI VERIFIED ON EXACT HEAD is not yes, use request-changes. If REWORK LIMIT REACHED is true, use needs-decision and do not request another automated cycle. If ALL CHANGED PATHS EXCLUDED is true, add '## No reviewable code changes' listing every path from changed-paths.txt. COMPLETION: draft review.md early and keep it current as you go, then post it via mcp__github_comment__update_claude_comment, ending review.md (not the comment) with '<!-- claude-review-complete -->'. Do not ration turns or stop early to reserve room — you cannot observe your turn count and the runtime enforces the cap for you; review the prioritized list fully. A partial review beats no review. DUPLICATES: check existing comments with 'gh pr view' before posting. LOGGING: in src-api/ code, console.* is forbidden — must use createLogger(). WORKSPACE: src-api/ must not use process.cwd() — use the session/project resolver or getSetting('workDir') with the subsystem's path validation, not a blanket getSetting('workDir') ?? process.cwd() fallback. TYPES: import type must be used for type-only imports. I18N: new strings must exist in all 6 locale files (en, zh, es, fr, hi, pt). TAURI: flag overly broad capabilities or unvalidated IPC inputs. INLINE COMMENTS: only post inline comments if ENABLE_INLINE_COMMENTS is 'true', otherwise include all findings in the summary comment with file:line references."

      - name: Verify the review was posted
        if: ${{ !cancelled() && steps.skip.outputs.skip != 'true' && steps.diff.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          REQUIRED_SECTION: ${{ env.REVIEW_REQUIRED_SECTION }}
          REVIEW_HEAD: ${{ steps.evidence.outputs.head }}
          CI_VERIFIED: ${{ steps.evidence.outputs.ci_verified }}
          REWORK_LIMIT_REACHED: ${{ steps.evidence.outputs.rework_limit_reached }}
          ALL_EXCLUDED: ${{ steps.diff.outputs.all_excluded }}
        run: |
          set -euo pipefail

          if [ -z "${REVIEW_HEAD:-}" ]; then
            echo "::error::No reviewed head was captured; the review cannot be bound to a revision."
            exit 1
          fi

          # A review is evidence for one revision. If a follow-up push landed while
          # this run was working, the review is stale no matter how good it is.
          CURRENT_HEAD=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_HEAD" != "$REVIEW_HEAD" ]; then
            {
              echo "<!-- claude-review-guard -->"
              echo "> ⚠️ PR head moved from \`$REVIEW_HEAD\` to \`$CURRENT_HEAD\` after this review started."
              echo "> The review is bound to the older revision and is not valid evidence for the current head."
              echo "> Re-run the review on the new head."
              echo
              echo "- Job log: $RUN_URL"
            } > stale-review.md
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file stale-review.md
            exit 1
          fi

          printf -v HEAD_STAMP 'Head: `%s`' "$REVIEW_HEAD"

          # Completion needs two independent facts, because neither alone is sufficient:
          #
          #   1. Claude finished writing  — review.md ends with the completion marker.
          #   2. A finished review reached the PR — this run's claude[bot] comment carries the
          #      required section heading.
          #   3. The review is bound to this revision — the comment stamps the captured head and
          #      CI Gate line, carries a valid verdict, and the PR head has not moved.
          #
          # Neither fact is checked on the other's artifact, because each is only observable
          # where it survives:
          #
          # The marker is checked on the FILE, never the comment.
          # mcp__github_comment__update_claude_comment strips HTML comments from the body it
          # posts. Run 34356058557 posted a complete review, byte-identical to review.md except
          # the stripped marker, and the guard failed it. (GitHub preserves HTML comments —
          # CodeRabbit's on the same PR keep five. The sanitizing is the action's.)
          #
          # The comment is checked STRUCTURALLY, never by matching review.md's text. Claude
          # legitimately polishes while posting — run 34360047300 reworded as it went and added
          # a verification block, leaving only 5 of 18 substantive lines byte-identical, and a
          # fingerprint-matching guard failed that good review too. The posted comment was the
          # better of the two. What reliably separates a finished review from an abandoned
          # progress checklist is the mandated section heading, so that is what is checked.
          if ! [ -s review.md ] || ! grep -qF '<!-- claude-review-complete -->' review.md; then
            REVIEW_POSTED=no
          else
            PRE_RUN_IDS=pre-run-claude-comments.txt
            [ -f "$PRE_RUN_IDS" ] || : > "$PRE_RUN_IDS"

            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "claude[bot]") | "\(.id) \(.body | @base64)"' \
              > claude-comments.txt || : > claude-comments.txt

            # A comment counts as this run's if it did not exist before the run started, or if
            # it carries the run id. Either signal alone is enough: the snapshot survives a
            # change to how the action formats tracking comments, and the run id survives a
            # missing snapshot. Requiring both would make the guard fail closed on every run
            # if either mechanism drifted.
            REVIEW_POSTED=no
            while read -r comment_id body_b64; do
              [ -n "${body_b64:-}" ] || continue
              body=$(printf '%s' "$body_b64" | base64 -d)
              # Pre-existing and not stamped with this run id — belongs to an earlier review.
              if grep -qx -- "$comment_id" "$PRE_RUN_IDS" \
                 && ! printf '%s' "$body" | grep -qF -- "$GITHUB_RUN_ID"; then
                continue
              fi
              # An abandoned run leaves the tracking comment as a progress checklist, which
              # could still name the required section in a "- [ ] Write Layer Summary" item.
              # An unchecked box is the thing that actually distinguishes it: run 34312666877's
              # stalled comment has seven, and every real review posted so far has none.
              if printf '%s' "$body" | grep -qF -- '- [ ]'; then
                continue
              fi
              # `--` because a heading could begin with a dash; `-i` because markdown
              # heading case is not worth failing a good review over.
              if ! printf '%s' "$body" | grep -qiF -- "$REQUIRED_SECTION"; then
                continue
              fi
              # The review must be bound to the captured revision, not to whatever
              # head happens to be current when the comment is read.
              if ! printf '%s' "$body" | grep -qF -- "$HEAD_STAMP"; then
                echo "::warning::Review comment does not stamp the reviewed head $REVIEW_HEAD."
                continue
              fi
              if ! printf '%s' "$body" | grep -qF -- 'CI Gate:'; then
                echo "::warning::Review comment does not stamp the CI Gate evidence."
                continue
              fi

              VERDICT=$(printf '%s' "$body" \
                | grep -oE 'Verdict: `(ready-for-human|request-changes|needs-decision)`' \
                | tail -n 1 \
                | sed -E 's/.*`([^`]+)`/\1/')
              if [ -z "$VERDICT" ]; then
                echo "::warning::Review comment has no structured Verdict line."
                continue
              fi
              if [ "${CI_VERIFIED:-no}" != "yes" ] && [ "$VERDICT" = "ready-for-human" ]; then
                echo "::warning::Review claims ready-for-human but CI is not verified on $REVIEW_HEAD."
                continue
              fi
              if [ "${REWORK_LIMIT_REACHED:-false}" = "true" ] && [ "$VERDICT" != "needs-decision" ]; then
                echo "::warning::Automated rework limit reached; verdict must be needs-decision, got $VERDICT."
                continue
              fi
              if [ "${ALL_EXCLUDED:-false}" = "true" ] \
                 && ! printf '%s' "$body" | grep -qF -- 'No reviewable code changes'; then
                echo "::warning::Scoped diff was empty; the review must state 'No reviewable code changes' and list the excluded paths."
                continue
              fi

              REVIEW_POSTED=yes
              break
            done < claude-comments.txt
          fi

          if [ "$REVIEW_POSTED" = yes ]; then
            echo "Review posted and marked complete."
            exit 0
          fi

          if [ -s review.md ]; then
            # Claude produced a summary but never posted a complete one. Salvage it rather
            # than leaving the PR with an unfinished checklist.
            echo "::warning::Claude wrote a summary but did not post a completed review; salvaging it."
            {
              echo "<!-- claude-review-guard -->"
              echo "> ⚠️ The review session ended before posting a completed review ([job log]($RUN_URL))."
              echo "> The summary it had produced is below, and may be partial."
              echo
              cat review.md
            } > salvaged-review.md
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file salvaged-review.md
            exit 1
          fi

          echo "::error::Claude finished without producing a review — nothing was posted."
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%s\n' \
            "<!-- claude-review-guard -->" \
            "### ❌ Claude review did not complete" \
            "" \
            "The review session ended without producing a summary, so there is nothing to report yet." \
            "" \
            "- Job log: $RUN_URL" \
            "- Claude session conclusion: \`${CLAUDE_CONCLUSION:-unknown}\`" \
            "" \
            "Comment \`@review\` to retry. If it keeps failing, the diff is likely too large for one pass — narrow it with the \`REVIEW_EXCLUDE_PATHS\` repository variable or raise \`REVIEW_MAX_TURNS\`.")"
          exit 1

      - name: Upload reports artifact
        if: ${{ !cancelled() && steps.skip.outputs.skip != 'true' && steps.pr.outputs.generate_report == 'true' && hashFiles('reports/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: claude-reports-pr-${{ steps.pr.outputs.number }}
          path: reports/**
          retention-days: 30

      - name: Upload review diagnostics
        if: ${{ !cancelled() && steps.skip.outputs.skip != 'true' && steps.diff.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: claude-review-diagnostics-pr-${{ steps.pr.outputs.number }}
          path: |
            changed-paths.txt
            pr-files.txt
            pr-diff.patch
            pr-metadata.json
            check-runs.json
            pr-gate.json
            review-evidence.md
            review.md
          if-no-files-found: ignore
          retention-days: 7
