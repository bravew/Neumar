<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Video parity acceptance fixture</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07111f;
        color: white;
        font-family: Arial, sans-serif;
      }
      main {
        position: relative;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 70% 20%, #0ea5e955, transparent 35%),
          linear-gradient(135deg, #07111f, #14213d);
      }
      .card {
        position: absolute;
        inset: 18%;
        display: grid;
        place-items: center;
        border: 2px solid #38bdf8;
        border-radius: 36px;
        background: #0f172acc;
      }
      h1 {
        margin: 0;
        font-size: clamp(48px, 6vw, 120px);
        letter-spacing: -0.04em;
      }
      .caption {
        position: absolute;
        bottom: 8%;
        left: 50%;
        padding: 16px 24px;
        border-radius: 14px;
        background: #020617dd;
        font-size: 32px;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <main
      data-hf-id="parity-root"
      data-composition-id="video-parity-v1"
      data-width="1920"
      data-height="1080"
      data-duration="15"
    >
      <section class="card" data-hf-id="parity-card">
        <h1 data-hf-id="parity-title">Video parity v1</h1>
      </section>
      <div class="caption" data-hf-id="parity-caption">
        Deterministic caption fixture
      </div>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const duration = 15;
      const card = document.querySelector('.card');
      const caption = document.querySelector('.caption');
      let currentTime = 0;
      const animations = [
        card.animate(
          [
            {
              opacity: 0,
              transform: 'translateX(-8%) scale(0.92) rotate(-2deg)',
              filter: 'brightness(0.8)',
              offset: 0,
            },
            {
              opacity: 1,
              transform: 'translateX(4%) scale(1.08) rotate(1deg)',
              filter: 'brightness(1.1)',
              offset: 0.6,
            },
            {
              opacity: 0.5,
              transform: 'translateX(0%) scale(1) rotate(0deg)',
              filter: 'brightness(1.1)',
              offset: 1,
            },
          ],
          { duration: duration * 1000, fill: 'forwards', easing: 'linear' },
        ),
        caption.animate(
          [
            { opacity: 0, offset: 0 },
            { opacity: 0, offset: 0.1 },
            { opacity: 1, offset: 0.2 },
            { opacity: 1, offset: 0.8 },
            { opacity: 0, offset: 0.9 },
            { opacity: 0, offset: 1 },
          ],
          { duration: duration * 1000, fill: 'forwards', easing: 'linear' },
        ),
      ];

      function seek(time) {
        currentTime = Math.max(0, Math.min(Number(time) || 0, duration));
        for (const animation of animations) {
          animation.currentTime = currentTime * 1000;
        }
      }

      window.__timelines['video-parity-v1'] = {
        pause() {
          for (const animation of animations) animation.pause();
          return this;
        },
        play() {
          for (const animation of animations) animation.play();
          return this;
        },
        seek(time) {
          seek(time);
          return this;
        },
        totalTime(time) {
          if (time === undefined) return currentTime;
          seek(time);
          return currentTime;
        },
        time() {
          return currentTime;
        },
        duration() {
          return duration;
        },
        timeScale() {
          return this;
        },
      };
    </script>
  </body>
</html>
