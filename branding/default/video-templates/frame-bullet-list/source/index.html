<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0f12;
        color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        padding: 8vh 8vw;
        box-sizing: border-box;
      }
      h1 {
        font-size: clamp(36px, 5vw, 64px);
        margin: 0 0 4vh 0;
        letter-spacing: -0.02em;
        opacity: 0;
        transform: translateY(20px);
        animation: rise 600ms 100ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        font-size: clamp(20px, 3vw, 38px);
        line-height: 1.4;
        padding: 12px 0;
        opacity: 0;
        transform: translateY(16px);
        animation: rise 500ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      li.emphasis {
        color: #ff5a36;
        font-weight: 600;
      }
      li::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #ff5a36;
        border-radius: 50%;
        margin-right: 14px;
        transform: translateY(-6px);
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Bullet List</h1>
    <ul id="list"></ul>
    <script>
      var v = window.__NEUMA_VARS__ || {};
      if (v.title) document.getElementById('title').textContent = v.title;
      var list = document.getElementById('list');
      var items = Array.isArray(v.bullets) ? v.bullets : [];
      items.forEach(function (item, i) {
        var li = document.createElement('li');
        li.textContent = item.text || '';
        if (item.emphasis) li.className = 'emphasis';
        li.style.animationDelay = 350 + i * 400 + 'ms';
        list.appendChild(li);
      });
    </script>
  </body>
</html>
