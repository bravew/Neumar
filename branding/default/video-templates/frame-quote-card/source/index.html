<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --accent: #ff5a36;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0f12;
        color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        padding: 12vh 8vw;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .mark {
        font-size: clamp(96px, 16vw, 160px);
        line-height: 0.6;
        color: var(--accent);
        font-family: Georgia, 'Times New Roman', serif;
        opacity: 0;
        transform: translateY(20px) scale(0.9);
        animation: rise 700ms 100ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .quote {
        font-size: clamp(32px, 5vw, 56px);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
        margin: 4vh 0 6vh 0;
        opacity: 0;
        transform: translateY(20px);
        animation: rise 700ms 400ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .attr {
        font-size: clamp(18px, 2.4vw, 28px);
        color: #a1a1aa;
        opacity: 0;
        transform: translateY(16px);
        animation: rise 600ms 850ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .attr::before {
        content: '— ';
        color: var(--accent);
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="mark">"</div>
    <div class="quote" id="quote"></div>
    <div class="attr" id="attribution"></div>
    <script>
      var v = window.__NEUMA_VARS__ || {};
      if (v.quote) document.getElementById('quote').textContent = v.quote;
      if (v.attribution)
        document.getElementById('attribution').textContent = v.attribution;
      if (v.accent_color)
        document.body.style.setProperty('--accent', v.accent_color);
    </script>
  </body>
</html>
