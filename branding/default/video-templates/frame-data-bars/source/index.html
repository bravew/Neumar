<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0f12;
        color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        padding: 6vh 8vw;
        box-sizing: border-box;
      }
      h1 {
        font-size: clamp(36px, 5vw, 64px);
        margin: 0 0 8px 0;
        letter-spacing: -0.02em;
        opacity: 0;
        transform: translateY(20px);
        animation: rise 600ms 100ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .sub {
        font-size: clamp(16px, 2vw, 24px);
        color: #a1a1aa;
        margin: 0 0 4vh 0;
        opacity: 0;
        transform: translateY(20px);
        animation: rise 600ms 250ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .row {
        display: grid;
        grid-template-columns: 22vw 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 12px 0;
        opacity: 0;
        transform: translateY(16px);
        animation: rise 500ms forwards cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .label {
        font-size: clamp(16px, 2vw, 24px);
        color: #d4d4d8;
      }
      .barWrap {
        background: #1f2228;
        border-radius: 8px;
        height: 28px;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        background: linear-gradient(90deg, #ff5a36, #ff8a36);
        width: 0;
        transform-origin: left;
      }
      .value {
        font-size: clamp(20px, 2.4vw, 32px);
        font-variant-numeric: tabular-nums;
        color: #f5f5f4;
        min-width: 7ch;
        text-align: right;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Data Bars</h1>
    <p class="sub" id="subtitle"></p>
    <div id="rows"></div>
    <script>
      var v = window.__NEUMA_VARS__ || {};
      var dur = (window.__NEUMA_DURATION__ || 6) * 1000;
      if (v.title) document.getElementById('title').textContent = v.title;
      if (v.subtitle)
        document.getElementById('subtitle').textContent = v.subtitle;
      var unit = v.unit || '';
      var data = Array.isArray(v.data) ? v.data : [];
      var max = data.reduce(function (m, d) {
        return Math.max(m, Number(d.value || 0));
      }, 1);
      var rows = document.getElementById('rows');
      data.forEach(function (d, i) {
        var row = document.createElement('div');
        row.className = 'row';
        row.style.animationDelay = 400 + i * 250 + 'ms';

        var l = document.createElement('div');
        l.className = 'label';
        l.textContent = d.label || '';
        var wrap = document.createElement('div');
        wrap.className = 'barWrap';
        var bar = document.createElement('div');
        bar.className = 'bar';
        wrap.appendChild(bar);
        var val = document.createElement('div');
        val.className = 'value';
        val.textContent = '0' + unit;
        row.appendChild(l);
        row.appendChild(wrap);
        row.appendChild(val);
        rows.appendChild(row);

        var width = (Number(d.value || 0) / max) * 100;
        setTimeout(
          function () {
            bar.style.transition = 'width 900ms cubic-bezier(.22, .61, .36, 1)';
            bar.style.width = width + '%';
            var start = performance.now();
            var endValue = Number(d.value || 0);
            function tick(now) {
              var p = Math.min(1, (now - start) / 900);
              val.textContent = Math.round(p * endValue) + unit;
              if (p < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
          },
          400 + i * 250 + 100,
        );
      });
    </script>
  </body>
</html>
